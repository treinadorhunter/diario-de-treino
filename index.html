<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Treinador Hunter - Diário de Treino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        .active-tab-glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased select-none pb-20">

    <!-- App Bar Header -->
    <header class="bg-slate-900 border-b border-slate-800/80 sticky top-0 z-40 shadow-md backdrop-blur-md bg-slate-900/90">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 shrink-0">
                    <i class="fa-solid fa-dumbbell text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold text-white tracking-tight flex items-center gap-1.5">
                        Treinador Hunter <span class="text-xs px-2 py-0.5 rounded-full bg-blue-500/15 text-blue-400 font-bold border border-blue-500/20">PRO</span>
                    </h1>
                    <div class="flex items-center gap-2 flex-wrap">
                        <div id="student-name-container" class="text-[11px] text-slate-300 font-medium">
                            <!-- Dynamic Student Name -->
                        </div>
                        <span class="text-slate-600 text-[10px]">•</span>
                        <div id="header-date-container" class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1">
                            <i class="fa-regular fa-calendar text-[9px]"></i>
                            <span id="current-date-text"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Top Actions -->
            <div class="flex items-center gap-1.5">
                <button onclick="toggleAdminMode()" id="btn-admin-toggle" class="px-2.5 py-1.5 bg-slate-800 border border-slate-700/80 text-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
                    <i class="fa-solid fa-lock text-slate-400" id="icon-admin-lock"></i>
                    <span id="text-admin-mode">Modo Aluno</span>
                </button>

                <button onclick="openModal('modal-menu')" class="w-9 h-9 bg-slate-800 border border-slate-700/80 text-slate-300 rounded-lg flex items-center justify-center active:scale-95 transition">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </div>
        </div>

        <!-- Dynamic Week Selector Bar -->
        <div id="week-tabs-container" class="px-3 pb-3 pt-1 flex items-center gap-2 overflow-x-auto no-scrollbar border-t border-slate-800/50">
            <!-- Dynamic Weeks Rendered Here -->
        </div>
    </header>

    <!-- Sticky Day Navigation Bar -->
    <nav class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-[108px] z-30 shadow-sm">
        <div id="day-tabs-container" class="px-2 py-2 flex items-center justify-start gap-1.5 overflow-x-auto no-scrollbar">
            <!-- Dynamic Day Tabs Rendered Here -->
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="px-3 py-4 space-y-4 flex-1">
        
        <!-- Strategy & Progress Banner Card / Week Admin Config -->
        <div id="week-banner-container" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden">
            <!-- Dynamic Content -->
        </div>

        <!-- Day Title Bar & Admin Controls -->
        <div class="flex flex-col gap-2 pt-1">
            <div id="day-title-container" class="w-full">
                <!-- Dynamic Day Title / Admin Form -->
            </div>

            <div class="flex justify-end">
                <button id="btn-add-exercise" onclick="addNewExercise()" class="hidden px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-plus text-xs"></i> Exercício
                </button>
            </div>
        </div>

        <!-- Exercises List Container -->
        <div id="exercises-list" class="space-y-4"></div>

        <!-- Session Notes (PSE) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
            <label class="text-xs font-extrabold text-slate-300 uppercase tracking-wider mb-2 flex items-center gap-2 block">
                <i class="fa-solid fa-pen-to-square text-blue-400"></i> Anotações / Percepção de Esforço (PSE)
            </label>
            <textarea id="session-notes" oninput="saveSessionNotes()" placeholder="Sua percepção de fadiga, dor articular, Pumps ou ajustes para o próximo treino..." class="w-full h-20 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
        </div>

        <!-- Botão Treinos Anteriores (Histórico) -->
        <div class="pt-1">
            <button onclick="openHistoryModal()" class="w-full py-3.5 px-4 bg-slate-900 border border-slate-800 hover:border-blue-500/50 text-blue-400 hover:text-blue-300 rounded-2xl text-xs font-extrabold flex items-center justify-center gap-2.5 shadow-md active:scale-98 transition">
                <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                <span>Treinos Anteriores (Histórico)</span>
            </button>
        </div>

    </main>

    <!-- Modal Calendário de Histórico -->
    <div id="modal-history" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto sm:hidden"></div>
            
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-blue-400"></i> Histórico de Treinos
                </h3>
                <button onclick="closeModal('modal-history')" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Navegação do Mês no Calendário -->
            <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                <button onclick="changeHistoryMonth(-1)" class="w-8 h-8 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-xs">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div id="calendar-month-year" class="text-xs font-extrabold text-white capitalize">
                    <!-- Dynamic Month/Year -->
                </div>
                <button onclick="changeHistoryMonth(1)" class="w-8 h-8 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-xs">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Grid do Mini Calendário -->
            <div id="calendar-grid-container" class="space-y-1">
                <!-- Dynamic Calendar Grid Rendered Here -->
            </div>

            <!-- Lista de Históricos Recentes -->
            <div class="pt-2 border-t border-slate-800 space-y-2">
                <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">
                    <i class="fa-solid fa-list-check text-emerald-400 mr-1"></i> Registros Recentes
                </label>
                <div id="history-recent-list" class="space-y-2 max-h-40 overflow-y-auto no-scrollbar">
                    <!-- Dynamic Recent History Items -->
                </div>
            </div>

            <button onclick="closeModal('modal-history')" class="w-full py-3 bg-slate-950 text-slate-400 rounded-xl text-xs font-bold mt-2">
                Fechar
            </button>
        </div>
    </div>

    <!-- Modal Detalhes do Treino Anterior (Comparador) -->
    <div id="modal-history-detail" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto sm:hidden"></div>

            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <div>
                    <span id="detail-date-badge" class="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold"></span>
                    <h3 id="detail-day-title" class="text-sm font-extrabold text-white mt-1"></h3>
                </div>
                <button onclick="closeModal('modal-history-detail')" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <p id="detail-week-title" class="text-xs text-amber-400 font-bold bg-slate-950 p-2 rounded-xl border border-slate-800"></p>

            <!-- Lista de Exercícios Registrados naquele dia -->
            <div id="detail-exercises-container" class="space-y-3"></div>

            <!-- Anotações daquele dia -->
            <div id="detail-notes-container" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-300"></div>

            <button onclick="closeModal('modal-history-detail')" class="w-full py-3 bg-slate-950 text-slate-400 rounded-xl text-xs font-bold mt-2">
                Voltar
            </button>
        </div>
    </div>

    <!-- Modal Menu Settings -->
    <div id="modal-menu" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3">
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-2 sm:hidden"></div>
            
            <h3 class="text-base font-extrabold text-white flex items-center gap-2 pb-2 border-b border-slate-800">
                <i class="fa-solid fa-sliders text-blue-400"></i> Opções da Planilha
            </h3>

            <div class="space-y-2 pt-1">
                <button onclick="exportData(); closeModal('modal-menu');" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold flex items-center justify-between transition border border-slate-700/60">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-download text-blue-400"></i> Exportar Backup (JSON)</span>
                    <i class="fa-solid fa-chevron-right text-slate-500 text-xs"></i>
                </button>

                <button onclick="triggerImport(); closeModal('modal-menu');" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold flex items-center justify-between transition border border-slate-700/60">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-upload text-emerald-400"></i> Importar Backup (JSON)</span>
                    <i class="fa-solid fa-chevron-right text-slate-500 text-xs"></i>
                </button>

                <button onclick="window.print(); closeModal('modal-menu');" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold flex items-center justify-between transition border border-slate-700/60">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-print text-amber-400"></i> Imprimir ou Gerar PDF</span>
                    <i class="fa-solid fa-chevron-right text-slate-500 text-xs"></i>
                </button>

                <button onclick="confirmReset(); closeModal('modal-menu');" class="w-full py-3 px-4 bg-red-950/40 hover:bg-red-900/60 text-red-300 rounded-xl text-xs font-bold flex items-center justify-between transition border border-red-800/40">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-rotate-left"></i> Resetar para os Padrões</span>
                    <i class="fa-solid fa-chevron-right text-red-500/60 text-xs"></i>
                </button>
            </div>

            <button onclick="closeModal('modal-menu')" class="w-full py-3 bg-slate-950 text-slate-400 rounded-xl text-xs font-bold mt-2">
                Fechar
            </button>
        </div>
    </div>

    <!-- Modal Confirm Reset -->
    <div id="modal-reset" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center">
            <div class="w-12 h-12 bg-red-500/10 border border-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-base font-extrabold text-white mb-1">Resetar Planilha?</h3>
            <p class="text-xs text-slate-400 mb-5">Todas as cargas, repetições salvas e observações serão apagadas permanentemente.</p>
            <div class="flex gap-2">
                <button onclick="closeModal('modal-reset')" class="flex-1 py-3 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">Cancelar</button>
                <button onclick="executeReset()" class="flex-1 py-3 bg-red-600 text-white rounded-xl text-xs font-bold">Sim, Apagar</button>
            </div>
        </div>
    </div>

    <!-- Modal Password (Acesso Treinador) -->
    <div id="modal-password" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <div>
                <h3 class="text-base font-extrabold text-white mb-1">Acesso do Treinador</h3>
                <p class="text-xs text-slate-400">Digite a senha para liberar o modo edição:</p>
            </div>
            <div>
                <input type="password" id="input-admin-pass" inputmode="numeric" maxlength="6" placeholder="****" 
                    onkeydown="if(event.key==='Enter') verifyAdminPassword()"
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-center text-lg font-extrabold tracking-widest text-amber-400 focus:outline-none focus:border-amber-500 transition">
                <p id="pass-error-msg" class="text-[11px] text-red-400 font-semibold mt-2 hidden">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Senha incorreta!
                </p>
            </div>
            <div class="flex gap-2">
                <button onclick="closeModal('modal-password')" class="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">Cancelar</button>
                <button onclick="verifyAdminPassword()" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl text-xs font-extrabold transition">Entrar</button>
            </div>
        </div>
    </div>

    <input type="file" id="file-import" class="hidden" accept=".json" onchange="importData(event)">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800/95 backdrop-blur text-white text-xs px-4 py-3 rounded-2xl border border-slate-700 shadow-2xl flex items-center gap-2.5 transform translate-y-24 opacity-0 transition-all duration-300 z-50 pointer-events-none w-[90%] max-w-xs justify-center">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg" class="font-semibold">Mensagem</span>
    </div>

    <script>
        /* CONFIGURAÇÃO DA API DO GOOGLE SHEETS COM SEGURANÇA */
        const API_URL = "https://script.google.com/macros/s/AKfycbzvEkGzOf1KSYVAxHLiui5cfTLEeDV26fgKoeTzpBBDLyiVzzQuqNNsTjwHf-1Z4Lr1-w/exec";
        const API_SECRET_TOKEN = "HunterTreinador2026@Seguro"; 

        const urlParams = new URLSearchParams(window.location.search);
        const currentStudent = (urlParams.get('aluno') || 'default').toLowerCase().trim();

        /* PALETA DE CORES E ÍCONES DAS SEMANAS */
        const WEEK_PALETTES = [
            { textClass: "text-amber-400", badgeClass: "bg-amber-500/15 text-amber-400 border-amber-500/30", icon: "fa-bolt" },
            { textClass: "text-red-400", badgeClass: "bg-red-500/15 text-red-400 border-red-500/30", icon: "fa-weight-hanging" },
            { textClass: "text-purple-400", badgeClass: "bg-purple-500/15 text-purple-400 border-purple-500/30", icon: "fa-cubes" },
            { textClass: "text-emerald-400", badgeClass: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30", icon: "fa-heart-pulse" }
        ];

        /* MODELOS PRONTOS DE FOCO ESTRATÉGICO */
        const WEEK_PRESETS = {
            metabolic: {
                label: "Estresse Metabólico",
                targetReps: "12-15 RM",
                titleSuffix: "Estresse Metabólico",
                desc: "Cargas moderadas a leves (12-15 RM), descansos curtos (60s) e RIR 1.",
                rirText: "RIR 1",
                paletteIdx: 0,
                defaultRest: "60s"
            },
            strength: {
                label: "Tensão Mecânica / Força",
                targetReps: "4-6 RM",
                titleSuffix: "Tensão Mecânica / Força",
                desc: "Cargas pesadas (4-6 RM), volume reduzido (-30%) e descansos longos (2 min).",
                rirText: "RIR 2",
                paletteIdx: 1,
                defaultRest: "2min"
            },
            hypertrophy: {
                label: "Hipertrofia Tradicional",
                targetReps: "8-10 RM",
                titleSuffix: "Hipertrofia Tradicional",
                desc: "Cargas moderadas-altas (8-10 RM), volume completo e falha próxima (RIR 0-1).",
                rirText: "RIR 0-1",
                paletteIdx: 2,
                defaultRest: "90s"
            },
            deload: {
                label: "Deload / Recuperação",
                targetReps: "Deload",
                titleSuffix: "Deload / Recuperação",
                desc: "Corte de 50% no volume, carga leve-moderada e longe da falha (RIR 3-4).",
                rirText: "RIR 3-4",
                paletteIdx: 3,
                defaultRest: "60s"
            }
        };

        /* PROGRAMA PADRÃO DO TREINO */
        const DEFAULT_PROGRAM = {
            studentName: "Nome do Aluno",
            history: {},
            weeks: [
                {
                    id: "W1",
                    shortTitle: "Semana 1",
                    targetReps: "12-15 RM",
                    title: "Semana 1 — Estresse Metabólico",
                    desc: "Cargas moderadas a leves (12-15 RM), descansos curtos (60s) e RIR 1.",
                    rirText: "RIR 1",
                    paletteIdx: 0,
                    days: [
                        { id: "SEG", shortName: "Seg • Upper", name: "Segunda: Upper (Superior Geral)", exercises: [
                            { name: "Supino Reto c/ Barra", sets: 4, targetReps: "12-15", rest: "60s", notes: "Controle na fase excêntrica." },
                            { name: "Remada Curvada c/ Barra", sets: 4, targetReps: "12-15", rest: "60s", notes: "Tronco estável e cotovelos firmes." },
                            { name: "Desenvolvimento c/ Halteres", sets: 3, targetReps: "12-15", rest: "60s", notes: "Escápulas travadas no banco." },
                            { name: "Puxada Alta Neutra (Lat Pulldown)", sets: 3, targetReps: "12-15", rest: "60s", notes: "Puxar direcionando aos cotovelos." },
                            { name: "Super-série: Rosca Direta + Tríceps Testa", sets: 3, targetReps: "12-15", rest: "60s", notes: "Sem pausa longa entre os dois." }
                        ]},
                        { id: "TER", shortName: "Ter • Lower", name: "Terça: Lower (Inferior Geral)", exercises: [
                            { name: "Agachamento Livre c/ Barra", sets: 4, targetReps: "12-15", rest: "90s", notes: "Profundidade mantendo pelve neutra." },
                            { name: "Stiff / RDL c/ Barra", sets: 4, targetReps: "12-15", rest: "60s", notes: "Quadril para trás, alongando posterior." },
                            { name: "Cadeira Extensora", sets: 3, targetReps: "12-15", rest: "60s", notes: "Pausa de 1s no topo contraído." },
                            { name: "Mesa Flexora", sets: 3, targetReps: "12-15", rest: "60s", notes: "Sem compensação na lombar." },
                            { name: "Panturrilha em Pé (Gêmeos)", sets: 4, targetReps: "12-15", rest: "45s", notes: "Amplitude total com pausa estrita." }
                        ]}
                    ]
                }
            ]
        };

        /* ESTADO DO APP */
        let currentWeekIdx = 0;
        let currentDayIdx = 0;
        let workoutData = {};
        let isAdminMode = false;
        let saveTimeout = null;

        // Controle do Calendário de Histórico
        let calendarYear = new Date().getFullYear();
        let calendarMonth = new Date().getMonth();

        /* INICIALIZAÇÃO */
        window.addEventListener('DOMContentLoaded', async () => {
            await loadWorkoutData();
            renderHeaderDate();
            renderHeader();
            renderApp();
        });

        function getTodayKey() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function renderHeaderDate() {
            const container = document.getElementById('current-date-text');
            if (container) {
                const now = new Date();
                container.textContent = now.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
            }
        }

        function normalizeWorkoutData(data) {
            if (!data) return;
            if (!data.studentName) data.studentName = "Nome do Aluno";
            if (!data.history) data.history = {};

            if (!data.weeks) {
                data.weeks = [];
                const oldKeys = ['W1', 'W2', 'W3', 'W4'];
                oldKeys.forEach((k, idx) => {
                    if (data[k]) {
                        data.weeks.push({
                            id: k,
                            shortTitle: `Semana ${idx + 1}`,
                            targetReps: k === 'W1' ? '12-15 RM' : k === 'W2' ? '4-6 RM' : k === 'W3' ? '8-10 RM' : 'Deload',
                            title: data[k].title || `Semana ${idx + 1}`,
                            desc: data[k].desc || "",
                            rirText: data[k].rirText || "RIR 1",
                            paletteIdx: idx % WEEK_PALETTES.length,
                            days: data[k].days || []
                        });
                        delete data[k];
                    }
                });
            }

            data.weeks.forEach((w) => {
                if (w.days && !Array.isArray(w.days)) {
                    const daysArr = [];
                    const defaultLabels = { SEG: 'Seg • Upper', TER: 'Ter • Lower', QUA: 'Qua • Push', QUI: 'Qui • Pull', SEX: 'Sex • Legs' };
                    Object.keys(w.days).forEach(dKey => {
                        daysArr.push({
                            id: dKey,
                            shortName: defaultLabels[dKey] || dKey,
                            name: w.days[dKey].name || dKey,
                            notes: w.days[dKey].notes || '',
                            exercises: w.days[dKey].exercises || []
                        });
                    });
                    w.days = daysArr;
                }
            });
        }

        async function loadWorkoutData() {
            if (API_URL) {
                try {
                    showToast("Carregando treino...", "fa-cloud-arrow-down", "text-blue-400");
                    const response = await fetch(`${API_URL}?aluno=${currentStudent}&token=${encodeURIComponent(API_SECRET_TOKEN)}`);
                    const data = await response.json();

                    if (data && data.error === "Aluno não encontrado.") {
                        showToast("Aluno não cadastrado pelo treinador!", "fa-triangle-exclamation", "text-amber-400");
                        workoutData = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
                        normalizeWorkoutData(workoutData);
                        return;
                    }

                    if (data && !data.error && !data.empty) {
                        workoutData = data;
                        normalizeWorkoutData(workoutData);
                        localStorage.setItem(`WORKOUT_${currentStudent}`, JSON.stringify(data));
                        showToast("Treino atualizado!", "fa-circle-check", "text-emerald-400");
                        return;
                    }
                } catch (e) {
                    console.error("Erro ao conectar à nuvem:", e);
                }
            }

            const saved = localStorage.getItem(`WORKOUT_${currentStudent}`);
            if (saved) {
                try {
                    workoutData = JSON.parse(saved);
                } catch(e) {
                    workoutData = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
                }
            } else {
                workoutData = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
            }
            normalizeWorkoutData(workoutData);
        }

        /* GRAVA O HISTÓRICO DO DIA ATUAL */
        function updateTodayHistoryRecord() {
            const todayKey = getTodayKey();
            const currentWeek = workoutData.weeks[currentWeekIdx];
            if (!currentWeek || !currentWeek.days || !currentWeek.days[currentDayIdx]) return;

            const currentDay = currentWeek.days[currentDayIdx];
            const exercises = currentDay.exercises || [];

            let hasActivity = false;
            exercises.forEach(ex => {
                if (ex.logs && ex.logs.some(l => l && (l.done || (l.load !== '' && l.load !== undefined)))) {
                    hasActivity = true;
                }
            });

            if (hasActivity || (currentDay.notes && currentDay.notes.trim() !== '')) {
                if (!workoutData.history) workoutData.history = {};
                
                const now = new Date();
                workoutData.history[todayKey] = {
                    dateKey: todayKey,
                    dateFormatted: now.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }),
                    weekTitle: currentWeek.title || '',
                    dayName: currentDay.name || '',
                    dayShortName: currentDay.shortName || '',
                    notes: currentDay.notes || '',
                    exercises: JSON.parse(JSON.stringify(exercises)),
                    updatedAt: now.toISOString()
                };
            }
        }

        function saveWorkoutData() {
            updateTodayHistoryRecord();
            localStorage.setItem(`WORKOUT_${currentStudent}`, JSON.stringify(workoutData));
            updateMetrics();

            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                if (!API_URL) return;
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            aluno: currentStudent,
                            token: API_SECRET_TOKEN,
                            data: workoutData
                        })
                    });
                } catch (e) {
                    console.error("Erro ao salvar no Google Sheets:", e);
                }
            }, 1000);
        }

        async function verifyAdminPassword() {
            const inputPass = document.getElementById('input-admin-pass').value;
            const errorMsg = document.getElementById('pass-error-msg');

            showToast("Verificando senha...", "fa-key", "text-amber-400");

            try {
                const res = await fetch(`${API_URL}?action=verifyPass&pass=${encodeURIComponent(inputPass)}&token=${encodeURIComponent(API_SECRET_TOKEN)}`);
                const result = await res.json();

                if (result && result.valid) {
                    isAdminMode = true;
                    closeModal('modal-password');
                    updateAdminUI();
                    showToast("Modo Edição Ativado!", "fa-lock-open", "text-amber-400");

                showToast("Erro ao validar senha no servidor", "fa-triangle-exclamation", "text-red-400");
            }

                btn.onclick = () => { currentWeekIdx = idx; renderApp(); };

        function applyWeekPreset(presetKey) {
            const preset = WEEK_PRESETS[presetKey];
            if (!preset) return;

            const week = workoutData.weeks[currentWeekIdx];
            if (!week) return;

            const weekLabel = week.shortTitle || `Semana ${currentWeekIdx + 1}`;
            week.targetReps = preset.targetReps;
            week.title = `${weekLabel} — ${preset.titleSuffix}`;
            week.desc = preset.desc;
            week.rirText = preset.rirText;
            week.paletteIdx = preset.paletteIdx;

            if (week.days) {
                week.days.forEach(day => {
                    if (day.exercises) {
                        day.exercises.forEach(ex => {
                            ex.rest = preset.defaultRest;
                        });
                    }
                });
            }

            saveWorkoutData();
            renderApp();
            showToast(`Modelo '${preset.label}' aplicado (${preset.defaultRest})!`, "fa-bolt", "text-amber-400");
        }

        function addNewWeek() {
            const weeks = workoutData.weeks || [];
            const newWeekNum = weeks.length + 1;
            
            const sampleDays = weeks.length > 0 ? weeks[0].days : [];
            const clonedDays = JSON.parse(JSON.stringify(sampleDays));

            clonedDays.forEach(day => {
                day.exercises.forEach(ex => { ex.logs = []; });
                day.notes = "";
            });

            weeks.push({
                id: `W_${Date.now()}`,
                shortTitle: `Semana ${newWeekNum}`,
                targetReps: "8-10 RM",
                title: `Semana ${newWeekNum} — Hipertrofia Tradicional`,
                desc: "Cargas moderadas-altas (8-10 RM), volume completo e falha próxima (RIR 0-1).",
                rirText: "RIR 0-1",
                paletteIdx: (weeks.length) % WEEK_PALETTES.length,
                days: clonedDays
            });

            currentWeekIdx = weeks.length - 1;
            saveWorkoutData();
            renderApp();
            showToast("Nova semana adicionada!", "fa-circle-plus", "text-emerald-400");
        }

        function deleteCurrentWeek() {
            const weeks = workoutData.weeks || [];
            if (weeks.length <= 1) {
                showToast("O treino deve ter pelo menos 1 semana!", "fa-triangle-exclamation", "text-amber-400");
                return;
            }

            weeks.splice(currentWeekIdx, 1);
            currentWeekIdx = Math.max(0, currentWeekIdx - 1);
            saveWorkoutData();
            renderApp();
            showToast("Semana removida", "fa-trash-can", "text-amber-400");
        }

        function updateWeekProp(prop, val) {
            const currentWeek = workoutData.weeks[currentWeekIdx];
            if (currentWeek) {
                currentWeek[prop] = val;
                saveWorkoutData();
                renderApp();

        }

                                    -
                                </button>

                let notesHtml = '';
                if (ex.notes || isAdminMode) {
                    notesHtml = `

                                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-[11px] text-slate-300 focus:outline-none">
                            ` : `
                                <p class="text-[11px] text-slate-400 bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5 flex items-start gap-2">
                                    <i class="fa-solid fa-circle-info text-blue-400 text-xs mt-0.5"></i>
                                    <span>${escapeHtml(ex.notes)}</span>

                }

                exCard.innerHTML = `

                    ${notesHtml}

                        ${setsRowsHtml}
                    </div>
                `;

                listEl.appendChild(exCard);
            });
        }

        function adjustSetVal(exIdx, setIdx, field, delta) {
            const ex = workoutData.weeks[currentWeekIdx].days[currentDayIdx].exercises[exIdx];
            if (!ex.logs) ex.logs = [];

            let defaultReps = getTargetRepsNum(ex.targetReps);

            if (!ex.logs[setIdx]) ex.logs[setIdx] = { load: '', reps: defaultReps, done: false };

            let currentVal = parseNum(ex.logs[setIdx][field]);
            if (typeof currentVal !== 'number') {
                currentVal = field === 'reps' ? defaultReps : 0;
            }

            let step = 1;
            let newVal = Math.max(0, currentVal + (delta * step));
            newVal = Math.round(newVal * 10) / 10;

            ex.logs[setIdx][field] = newVal;
            saveWorkoutData();
            renderExercises();
        }

        function updateSetLog(exIdx, setIdx, field, value) {
            const ex = workoutData.weeks[currentWeekIdx].days[currentDayIdx].exercises[exIdx];
            if (!ex.logs) ex.logs = [];
            if (!ex.logs[setIdx]) ex.logs[setIdx] = { load: '', reps: '', done: false };

            if (field === 'load' || field === 'reps') {
                ex.logs[setIdx][field] = parseNum(value);
            }

            saveWorkoutData();
            updateMetrics();
        }

        function toggleSetDone(exIdx, setIdx) {
            const ex = workoutData.weeks[currentWeekIdx].days[currentDayIdx].exercises[exIdx];
            if (!ex.logs) ex.logs = [];

            let defaultReps = getTargetRepsNum(ex.targetReps);

            if (!ex.logs[setIdx]) ex.logs[setIdx] = { load: '', reps: defaultReps, done: false };

            if (!ex.logs[setIdx].done && (ex.logs[setIdx].reps === '' || ex.logs[setIdx].reps === undefined)) {
                ex.logs[setIdx].reps = defaultReps;
            }

            ex.logs[setIdx].done = !ex.logs[setIdx].done;

            if (navigator.vibrate) {
                navigator.vibrate(40);
            }

            saveWorkoutData();
            renderExercises();
        }

        function updateMetrics() {
            const weekInfo = workoutData.weeks[currentWeekIdx];
            if (!weekInfo || !weekInfo.days || !weekInfo.days[currentDayIdx]) return;

            const dayInfo = weekInfo.days[currentDayIdx];
            const exercises = dayInfo.exercises || [];

            let totalSets = 0;
            let completedSets = 0;
            let totalTonnage = 0;

            exercises.forEach(ex => {
                const count = ex.sets || 3;
                totalSets += count;

                let defaultReps = getTargetRepsNum(ex.targetReps);

                if (ex.logs) {
                    for (let s = 0; s < count; s++) {
                        const log = ex.logs[s];
                        if (log) {
                            if (log.done) {
                                completedSets++;
                            }

                            const loadNum = parseNum(log.load);
                            const repsNum = parseNum(log.reps);

                            const load = typeof loadNum === 'number' ? loadNum : 0;
                            const reps = typeof repsNum === 'number' && repsNum > 0 ? repsNum : defaultReps;

                            if (log.done && load > 0) {
                                totalTonnage += (load * reps);
                            }
                        }
                    }
                }
            });

            const pct = totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 0;

            const elPercent = document.getElementById('metric-progress-percent');
            const elCount = document.getElementById('metric-progress-count');
            const elBar = document.getElementById('metric-progress-bar');
            const elTonnage = document.getElementById('metric-tonnage');
            const elRir = document.getElementById('metric-rir-short');

            if (elPercent) elPercent.textContent = `${pct}%`;
            if (elCount) elCount.textContent = `${completedSets}/${totalSets} séries`;
            if (elBar) elBar.style.width = `${pct}%`;
            if (elTonnage) elTonnage.innerHTML = `${totalTonnage.toLocaleString('pt-BR')} <span class="text-[10px] font-normal text-slate-400">kg</span>`;
            if (elRir) elRir.textContent = weekInfo.rirText || '-';
        }

        /* ATUALIZAÇÃO DE PROPRIEDADES DO EXERCÍCIO */
        function updateExerciseProp(exIdx, prop, value) {
            if (prop === 'rest' || prop === 'targetReps') {
                const ex = workoutData.weeks[currentWeekIdx].days[currentDayIdx].exercises[exIdx];
                if (ex) ex[prop] = value;
            } else {
                workoutData.weeks.forEach(week => {
                    if (week.days && week.days[currentDayIdx] && week.days[currentDayIdx].exercises[exIdx]) {
                        week.days[currentDayIdx].exercises[exIdx][prop] = value;
                    }
                });
            }
            saveWorkoutData();
            renderExercises();
        }

        function changeSetsCount(exIdx, delta) {
            workoutData.weeks.forEach(week => {
                if (week.days && week.days[currentDayIdx] && week.days[currentDayIdx].exercises[exIdx]) {
                    const ex = week.days[currentDayIdx].exercises[exIdx];
                    ex.sets = Math.max(1, (ex.sets || 3) + delta);
                }
            });
            saveWorkoutData();
            renderExercises();
        }

        function addNewExercise() {
            const currentWeek = workoutData.weeks[currentWeekIdx];
            let defaultRestTime = "60s";

            if (currentWeek && currentWeek.paletteIdx !== undefined) {
                const presetKeys = Object.keys(WEEK_PRESETS);
                const matchedPreset = presetKeys.find(k => WEEK_PRESETS[k].paletteIdx === currentWeek.paletteIdx);
                if (matchedPreset) defaultRestTime = WEEK_PRESETS[matchedPreset].defaultRest;
            }

            workoutData.weeks.forEach(week => {
                if (week.days && week.days[currentDayIdx]) {
                    week.days[currentDayIdx].exercises.push({
                        name: "Novo Exercício",
                        sets: 3,
                        targetReps: "8-12",
                        rest: defaultRestTime,
                        notes: "Dica de execução...",
                        logs: []
                    });
                }
            });
            saveWorkoutData();
            renderExercises();
            showToast("Exercício adicionado em todas as semanas!", "fa-circle-plus", "text-emerald-400");
        }

        function deleteExercise(exIdx) {
            workoutData.weeks.forEach(week => {
                if (week.days && week.days[currentDayIdx] && week.days[currentDayIdx].exercises) {
                    week.days[currentDayIdx].exercises.splice(exIdx, 1);
                }
            });
            saveWorkoutData();
            renderExercises();
            showToast("Exercício removido de todas as semanas", "fa-trash-can", "text-amber-400");
        }

        function saveSessionNotes() {
            const notes = document.getElementById('session-notes').value;
            workoutData.weeks[currentWeekIdx].days[currentDayIdx].notes = notes;
            saveWorkoutData();
        }

        /* LÓGICA DO MÓDULO DE HISTÓRICO DE TREINOS E CALENDÁRIO */
        function openHistoryModal() {
            renderHistoryCalendar();
            renderHistoryRecentList();
            openModal('modal-history');
        }

        function changeHistoryMonth(delta) {
            calendarMonth += delta;
            if (calendarMonth < 0) {
                calendarMonth = 11;
                calendarYear--;
            } else if (calendarMonth > 11) {
                calendarMonth = 0;
                calendarYear++;
            }
            renderHistoryCalendar();
        }

        function renderHistoryCalendar() {
            const monthYearEl = document.getElementById('calendar-month-year');
            const gridContainer = document.getElementById('calendar-grid-container');
            if (!gridContainer || !monthYearEl) return;

            const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            monthYearEl.textContent = `${monthNames[calendarMonth]} ${calendarYear}`;

            const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
            const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();

            let html = `
                <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-500 mb-1">
                    <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center">
            `;

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="p-2"></div>`;
            }

            const history = workoutData.history || {};

            for (let d = 1; d <= daysInMonth; d++) {
                const dayStr = String(d).padStart(2, '0');
                const monthStr = String(calendarMonth + 1).padStart(2, '0');
                const dateKey = `${calendarYear}-${monthStr}-${dayStr}`;

                const hasRecord = Boolean(history[dateKey]);

                if (hasRecord) {
                    html += `
                        <button onclick="viewHistoryDetail('${dateKey}')" class="p-1.5 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-extrabold text-xs hover:bg-emerald-500/30 transition flex flex-col items-center justify-center gap-0.5 shadow-sm">
                            <span>${d}</span>
                            <i class="fa-solid fa-circle-check text-[8px]"></i>
                        </button>
                    `;
                } else {
                    html += `
                        <div class="p-2 rounded-xl bg-slate-950/40 text-slate-600 text-xs font-semibold">
                            ${d}
                        </div>
                    `;
                }
            }

            html += `</div>`;
            gridContainer.innerHTML = html;
        }

        function renderHistoryRecentList() {
            const listEl = document.getElementById('history-recent-list');
            if (!listEl) return;
            listEl.innerHTML = '';

            const history = workoutData.history || {};
            const keys = Object.keys(history).sort().reverse();

            if (keys.length === 0) {
                listEl.innerHTML = `<div class="text-xs text-slate-500 text-center py-3">Nenhum treino concluído registrado ainda.</div>`;
                return;
            }

            keys.forEach(dateKey => {
                const item = history[dateKey];
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between cursor-pointer hover:border-blue-500/50 transition";
                card.onclick = () => viewHistoryDetail(dateKey);

                card.innerHTML = `
                    <div>
                        <div class="text-xs font-extrabold text-white">${escapeHtml(item.dayName || item.dayShortName || 'Treino')}</div>
                        <div class="text-[10px] text-slate-400">${escapeHtml(item.weekTitle || '')}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20">${item.dateFormatted}</span>
                        <i class="fa-solid fa-chevron-right text-slate-600 text-xs"></i>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function viewHistoryDetail(dateKey) {
            const history = workoutData.history || {};
            const item = history[dateKey];
            if (!item) return;

            document.getElementById('detail-date-badge').textContent = item.dateFormatted;
            document.getElementById('detail-day-title').textContent = item.dayName || 'Treino Realizado';
            document.getElementById('detail-week-title').textContent = item.weekTitle || '';

            const exContainer = document.getElementById('detail-exercises-container');
            exContainer.innerHTML = '';

            const exercises = item.exercises || [];
            exercises.forEach(ex => {
                const exCard = document.createElement('div');
                exCard.className = "bg-slate-950 border border-slate-800/80 p-3 rounded-xl space-y-2";

                let setsHtml = '';
                if (ex.logs && ex.logs.length > 0) {
                    ex.logs.forEach((log, sIdx) => {
                        if (log && log.done) {
                            setsHtml += `
                                <div class="flex items-center justify-between text-xs py-1 border-b border-slate-900 last:border-0">
                                    <span class="font-bold text-slate-500">Série #${sIdx + 1}</span>
                                    <span class="font-extrabold text-emerald-400">${log.load || 0} kg × ${log.reps || 0} reps</span>
                                </div>
                            `;
                        }
                    });
                }

                if (!setsHtml) {
                    setsHtml = `<div class="text-[11px] text-slate-500 italic">Sem séries concluídas registradas.</div>`;
                }

                exCard.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h4 class="text-xs font-extrabold text-white">${escapeHtml(ex.name)}</h4>
                        <span class="text-[10px] font-bold text-blue-400">${ex.sets || 3} séries</span>
                    </div>
                    <div class="space-y-0.5 pt-1">
                        ${setsHtml}
                    </div>
                `;
                exContainer.appendChild(exCard);

            const notesEl = document.getElementById('detail-notes-container');
            if (item.notes && item.notes.trim() !== '') {
                notesEl.innerHTML = `<span class="font-bold text-slate-400 block mb-1">Anotações da sessão:</span>${escapeHtml(item.notes)}`;
                notesEl.classList.remove('hidden');
            } else {
                notesEl.classList.add('hidden');
            }

            openModal('modal-history-detail');
        }

        function exportData() {
            const jsonStr = JSON.stringify(workoutData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `TreinadorHunter_Backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Backup exportado!", "fa-circle-check", "text-emerald-400");
        }

        function triggerImport() {
            document.getElementById('file-import').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data) {
                        workoutData = data;
                        normalizeWorkoutData(workoutData);
                        saveWorkoutData();
                        renderHeaderDate();
                        renderHeader();
                        renderApp();
                        showToast("Dados importados com sucesso!", "fa-circle-check", "text-emerald-400");
                    } else {
                        showToast("Arquivo JSON inválido!", "fa-circle-xmark", "text-red-400");
                    }
                } catch(err) {
                    showToast("Erro ao importar dados!", "fa-circle-xmark", "text-red-400");
                }
            };
            reader.readAsText(file);
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function confirmReset() {
            openModal('modal-reset');
        }

        function executeReset() {
            localStorage.removeItem(`WORKOUT_${currentStudent}`);
            workoutData = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
            normalizeWorkoutData(workoutData);
            closeModal('modal-reset');
            renderHeaderDate();
            renderHeader();
            renderApp();
            showToast("Dados resetados para padrão!", "fa-rotate-left", "text-amber-400");
        }

        function showToast(msg, iconClass = "fa-circle-check", iconColor = "text-emerald-400") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = msg;
            toastIcon.className = `fa-solid ${iconClass} ${iconColor}`;

            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 2500);
        }

        function getTargetRepsNum(targetRepsStr) {
            if (!targetRepsStr) return 10;
            const match = String(targetRepsStr).match(/\d+/);
            return match ? parseFloat(match[0]) : 10;
        }

        function parseNum(val) {
            if (val === null || val === undefined || val === '') return '';
            const clean = String(val).replace(',', '.').trim();
            const num = parseFloat(clean);
            return isNaN(num) ? '' : num;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
