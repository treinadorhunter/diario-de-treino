<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Treinador Hunter - Diário de Treino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        .active-tab-glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased select-none pb-20">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800/80 sticky top-0 z-40 shadow-md backdrop-blur-md bg-slate-900/90">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 shrink-0">
                    <i class="fa-solid fa-dumbbell text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold text-white tracking-tight flex items-center gap-1.5">
                        Treinador Hunter <span class="text-xs px-2 py-0.5 rounded-full bg-blue-500/15 text-blue-400 font-bold border border-blue-500/20">PRO</span>
                    </h1>
                    <div class="flex items-center gap-2 flex-wrap">
                        <div id="student-name-container" class="text-[11px] text-slate-300 font-medium"></div>
                        <span class="text-slate-600 text-[10px]">•</span>
                        <div id="header-cycle-badge" class="text-[10px] text-amber-400 font-bold flex items-center gap-1 bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/20"></div>
                        <span class="text-slate-600 text-[10px]">•</span>
                        <div id="header-sync-status" class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-cloud-check text-[9px]" id="sync-icon"></i>
                            <span id="sync-text">Nuvem OK</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ações do Topo -->
            <div class="flex items-center gap-1.5">
                <button onclick="toggleAdminMode()" id="btn-admin-toggle" class="px-2.5 py-1.5 bg-slate-800 border border-slate-700/80 text-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
                    <i class="fa-solid fa-lock text-slate-400" id="icon-admin-lock"></i>
                    <span id="text-admin-mode">Modo Aluno</span>
                </button>

                <button onclick="openModal('modal-menu')" class="w-9 h-9 bg-slate-800 border border-slate-700/80 text-slate-300 rounded-lg flex items-center justify-center active:scale-95 transition">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </div>
        </div>

        <!-- Seletor de Semanas -->
        <div id="week-tabs-container" class="px-3 pb-3 pt-1 flex items-center gap-2 overflow-x-auto no-scrollbar border-t border-slate-800/50"></div>
    </header>

    <!-- Navegação de Dias -->
    <nav class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-[68px] z-30 shadow-sm">
        <div id="day-tabs-container" class="px-2 py-2 flex items-center justify-start gap-1.5 overflow-x-auto no-scrollbar"></div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="px-3 py-4 space-y-4 flex-1">
        <div id="week-banner-container" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm relative overflow-hidden"></div>

        <div class="flex flex-col gap-2 pt-1">
            <div id="day-title-container" class="w-full"></div>
            <div class="flex justify-end">
                <button id="btn-add-exercise" onclick="addNewExercise()" class="hidden px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-plus text-xs"></i> Exercício
                </button>
            </div>
        </div>

        <!-- Lista de Exercícios -->
        <div id="exercises-list" class="space-y-4"></div>

        <!-- Notas da Sessão -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
            <div>
                <label class="text-xs font-extrabold text-slate-300 uppercase tracking-wider mb-2 flex items-center gap-2 block">
                    <i class="fa-solid fa-pen-to-square text-blue-400"></i> Anotações / Percepção de Esforço (PSE)
                </label>
                <textarea id="session-notes" oninput="saveSessionNotes()" placeholder="Sua percepção de fadiga, dores, pumps ou ajustes..." class="w-full h-20 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
            </div>
            <div id="missed-workout-container" class="pt-2 border-t border-slate-800/80"></div>
        </div>

        <div class="pt-1">
            <button onclick="openHistoryModal()" class="w-full py-3.5 px-4 bg-slate-900 border border-slate-800 hover:border-blue-500/50 text-blue-400 hover:text-blue-300 rounded-2xl text-xs font-extrabold flex items-center justify-center gap-2.5 shadow-md active:scale-98 transition">
                <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                <span>Treinos Anteriores (Histórico)</span>
            </button>
        </div>
    </main>

    <!-- Modais -->
    <div id="modal-mesocycle" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
                <h3 class="text-base font-extrabold text-white mb-1">Parabéns!</h3>
                <p class="text-xs text-slate-300 leading-relaxed">Você concluiu todos os treinos deste ciclo. Deseja reiniciar para o próximo ciclo?</p>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="cancelMesocycleComplete()" class="flex-1 py-3 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold active:scale-95 transition">Voltar</button>
                <button onclick="confirmMesocycleReset()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold active:scale-95 transition">Iniciar Próximo Ciclo</button>
            </div>
        </div>
    </div>

    <div id="modal-history" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto sm:hidden"></div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-blue-400"></i> Histórico de Treinos
                </h3>
                <button onclick="closeModal('modal-history')" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                <button onclick="changeHistoryMonth(-1)" class="w-8 h-8 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-xs"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="calendar-month-year" class="text-xs font-extrabold text-white capitalize"></div>
                <button onclick="changeHistoryMonth(1)" class="w-8 h-8 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-xs"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div id="calendar-grid-container" class="space-y-1"></div>
            <div class="pt-2 border-t border-slate-800 space-y-2">
                <label class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">
                    <i class="fa-solid fa-list-check text-emerald-400 mr-1"></i> Registros Recentes
                </label>
                <div id="history-recent-list" class="space-y-2 max-h-40 overflow-y-auto no-scrollbar"></div>
            </div>
            <button onclick="closeModal('modal-history')" class="w-full py-3 bg-slate-950 text-slate-400 rounded-xl text-xs font-bold mt-2">Fechar</button>
        </div>
    </div>

    <div id="modal-history-detail" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto sm:hidden"></div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <div>
                    <span id="detail-date-badge" class="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold"></span>
                    <h3 id="detail-day-title" class="text-sm font-extrabold text-white mt-1"></h3>
                </div>
                <button onclick="closeModal('modal-history-detail')" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p id="detail-week-title" class="text-xs text-amber-400 font-bold bg-slate-950 p-2 rounded-xl border border-slate-800"></p>
            <div id="detail-exercises-container" class="space-y-3"></div>
            <div id="detail-notes-container" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-300"></div>
            <button onclick="closeModal('modal-history-detail')" class="w-full py-3 bg-slate-950 text-slate-400 rounded-xl text-xs font-bold mt-2">Voltar</button>
        </div>
    </div>

    <div id="modal-menu" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3">
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-2 sm:hidden"></div>
            <h3 class="text-base font-extrabold text-white flex items-center gap-2 pb-2 border-b border-slate-800">
                <i class="fa-solid fa-sliders text-blue-400"></i> Opções da Planilha
            </h3>
            <div class="space-y-2 pt-1">
                <button onclick="exportData(); closeModal('modal-menu');" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold flex items-center justify-between transition border border-slate-700/60">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-download text-blue-400"></i> Exportar Backup (JSON)</span>
                    <i class="fa-solid fa-chevron-right text-slate-500 text-xs"></i>
                </button>
                <button onclick="triggerImport(); closeModal('modal-menu');" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold flex items-center justify-between transition border border-slate-700/60">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-upload text-emerald-400"></i> Importar Backup (JSON)</span>
                    <i class="fa-solid fa-chevron-right text-slate-500 text-xs"></i>
                </button>
                <button onclick="window.print(); closeModal('modal-menu');" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold flex items-center justify-between transition border border-slate-700/60">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-print text-amber-400"></i> Imprimir ou Gerar PDF</span>
                    <i class="fa-solid fa-chevron-right text-slate-500 text-xs"></i>
                </button>
                <button onclick="confirmReset(); closeModal('modal-menu');" class="w-full py-3 px-4 bg-red-950/40 hover:bg-red-900/60 text-red-300 rounded-xl text-xs font-bold flex items-center justify-between transition border border-red-800/40">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-rotate-left"></i> Resetar para Padrão</span>
                    <i class="fa-solid fa-chevron-right text-red-500/60 text-xs"></i>
                </button>
            </div>
            <button onclick="closeModal('modal-menu')" class="w-full py-3 bg-slate-950 text-slate-400 rounded-xl text-xs font-bold mt-2">Fechar</button>
        </div>
    </div>

    <div id="modal-password" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <div>
                <h3 class="text-base font-extrabold text-white mb-1">Acesso do Treinador</h3>
                <p class="text-xs text-slate-400">Digite a senha para liberar o modo edição:</p>
            </div>
            <div>
                <input type="password" id="input-admin-pass" inputmode="numeric" maxlength="6" placeholder="****" 
                    onkeydown="if(event.key==='Enter') verifyAdminPassword()"
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-center text-lg font-extrabold tracking-widest text-amber-400 focus:outline-none focus:border-amber-500 transition">
                <p id="pass-error-msg" class="text-[11px] text-red-400 font-semibold mt-2 hidden">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Senha incorreta!
                </p>
            </div>
            <div class="flex gap-2">
                <button onclick="closeModal('modal-password')" class="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">Cancelar</button>
                <button onclick="verifyAdminPassword()" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl text-xs font-extrabold transition">Entrar</button>
            </div>
        </div>
    </div>

    <input type="file" id="file-import" class="hidden" accept=".json" onchange="importData(event)">

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800/95 backdrop-blur text-white text-xs px-4 py-3 rounded-2xl border border-slate-700 shadow-2xl flex items-center gap-2.5 transform translate-y-24 opacity-0 transition-all duration-300 z-50 pointer-events-none w-[90%] max-w-xs justify-center">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg" class="font-semibold">Mensagem</span>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzvEkGzOf1KSYVAxHLiui5cfTLEeDV26fgKoeTzpBBDLyiVzzQuqNNsTjwHf-1Z4Lr1-w/exec";
        const API_SECRET_TOKEN = "HunterTreinador2026@Seguro"; 

        const urlParams = new URLSearchParams(window.location.search);
        const currentStudent = (urlParams.get('aluno') || 'teibe_h_27084347').toLowerCase().trim();

        const WEEK_PALETTES = [
            { textClass: "text-purple-400", badgeClass: "bg-purple-500/15 text-purple-400 border-purple-500/30", icon: "fa-cubes" },
            { textClass: "text-red-400", badgeClass: "bg-red-500/15 text-red-400 border-red-500/30", icon: "fa-weight-hanging" },
            { textClass: "text-amber-400", badgeClass: "bg-amber-500/15 text-amber-400 border-amber-500/30", icon: "fa-bolt" },

        ];

            cycleCount: 1,
            history: {},
            weeks: [
                {
                    id: "W1",
                    shortTitle: "Semana Hipertrofia / Força",
                    targetReps: "8-12 RM",
                    title: "Semana Hipertrofia / Força",
                    desc: "Cargas moderadas-altas (4-6 e 10-12 RM), volume completo e falha próxima (RIR 0-1).",
                    rirText: "RIR 0-1",
                    paletteIdx: 0,
                    days: [
                        {
                            id: "SEG",
                            shortName: "Seg • Full Body",
                            name: "Segunda: Full Body — Ênfase de Carga: Cadeia Anterior",
                            exercises: [
                                { name: "Agachamento Livre c/ Barra", sets: 4, targetReps: "4-6", rest: "2min", notes: "Profundidade mantendo pelve neutra." },
                                { name: "Supino Reto c/ Barra", sets: 4, targetReps: "4-6", rest: "2min", notes: "Tronco estável e cotovelos firmes." },
                                { name: "Puxada Alta Neutra (Lat Pulldown)", sets: 4, targetReps: "10-12", rest: "60s", notes: "Puxar direcionando aos cotovelos." },
                                { name: "Mesa Flexora", sets: 4, targetReps: "10-12", rest: "60s", notes: "Puxar direcionando aos posteriores." },
                                { name: "Elevação Lateral", sets: 4, targetReps: "10-12", rest: "60s", notes: "Sem balanço de tronco." },
                                { name: "Tríceps Polia", sets: 4, targetReps: "10-12", rest: "60s", notes: "Foco na porção lateral do tríceps." },
                                { name: "Abdominal Infra no Banco Inclinado", sets: 3, targetReps: "8-12", rest: "60s", notes: "Elevação controlada do quadril." },
                                { name: "Prancha Lateral", sets: 3, targetReps: "8-12", rest: "60s", notes: "Dica de execução..." }

                                { name: "Panturrilha Sentado (Solear)", sets: 4, targetReps: "10-12", rest: "60s", notes: "Trabalho direcionado para o músculo sóleo." },
                                { name: "Abdominal Supra (Solo ou Puxada)", sets: 3, targetReps: "8-12", rest: "60s", notes: "Dica de execução..." },
                                { name: "Prancha Frontal", sets: 3, targetReps: "8-12", rest: "60s", notes: "Estabilidade do core." }
                            ]
                        },
                        {
                            id: "SEX",
                            shortName: "Sex • Full Body",
                            name: "Sexta: Full Body — Ênfase de Carga: Ombros e Estresse Metabólico Global",
                            exercises: [
                                { name: "Desenvolvimento Militar / Halteres", sets: 4, targetReps: "4-6", rest: "2min", notes: "Escápulas travadas no banco." },
                                { name: "Afundo / Búlgaro", sets: 4, targetReps: "8-12", rest: "60s", notes: "Contração no topo do quadril." },
                                { name: "Chest Press na Polia Alta", sets: 4, targetReps: "10-12", rest: "60s", notes: "Cadência fluida e contínua." },
                                { name: "Remada Baixa no Triângulo / Remada Alta", sets: 4, targetReps: "10-12", rest: "60s", notes: "Foco pronunciado na dorsal." },
                                { name: "Tríceps Testa Polia + Rosca Martelo (Super-série - Braços)", sets: 3, targetReps: "10-12", rest: "60s", notes: "Trabalho direcionado para o músculo braquial/tríceps." },

        let currentWeekIdx = 0;
        let currentDayIdx = 0;
        let workoutData = {};
        let isAdminMode = false;
        let saveTimeout = null;
        let pendingMesocycleToggle = null;
        let restTimer = { intervalId: null, exIdx: null, remaining: 0, total: 0 };

        let calendarYear = new Date().getFullYear();
        let calendarMonth = new Date().getMonth();

        window.addEventListener('DOMContentLoaded', async () => {
            loadFromLocalStorageFirst();
            renderHeader();
            renderApp();
            await fetchFromSheetsAndUpdate();
        });

        function getTodayMonthKey() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            return `${year}-${month}`;
        }

        function loadFromLocalStorageFirst() {
            const saved = localStorage.getItem(`WORKOUT_${currentStudent}`);
            if (saved) {
                try {
                    workoutData = JSON.parse(saved);
                } catch(e) {
                    workoutData = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
                }
            } else {
                workoutData = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
            }
            normalizeWorkoutData(workoutData);
        }

        async function fetchFromSheetsAndUpdate() {
            if (!API_URL) return;
            setSyncStatus("loading", "Sincronizando...");
            try {
                const currentMonth = getTodayMonthKey();
                const response = await fetch(`${API_URL}?aluno=${currentStudent}&mes=${currentMonth}&token=${encodeURIComponent(API_SECRET_TOKEN)}`);
                const data = await response.json();

                if (data && !data.error && !data.empty) {
                    workoutData = data;
                    normalizeWorkoutData(workoutData);
                    localStorage.setItem(`WORKOUT_${currentStudent}`, JSON.stringify(data));
                    renderHeader();
                    renderApp();
                    setSyncStatus("success", "Nuvem OK");
                } else if (data && data.empty) {
                    sendDataToSheetsDirect(workoutData);
                    setSyncStatus("success", "Nuvem OK");
                }
            } catch (e) {
                console.error("Erro ao sincronizar com Google Sheets:", e);
                setSyncStatus("error", "Offline (Local)");
            }
        }

        function setSyncStatus(status, text) {
            const icon = document.getElementById('sync-icon');
            const textEl = document.getElementById('sync-text');
            if (!icon || !textEl) return;

            textEl.textContent = text;
            if (status === "loading") {
                icon.className = "fa-solid fa-arrows-rotate fa-spin text-[9px] text-amber-400";
            } else if (status === "success") {
                icon.className = "fa-solid fa-cloud-check text-[9px] text-emerald-400";
            } else {
                icon.className = "fa-solid fa-cloud-slash text-[9px] text-red-400";
            }
        }

        function normalizeWorkoutData(data) {
            if (!data) return;
            if (!data.studentName) data.studentName = "Teibe Figueiredo";
            if (!data.cycleCount) data.cycleCount = 1;
            if (!data.history) data.history = {};
            if (!data.weeks || data.weeks.length === 0) {
                data.weeks = JSON.parse(JSON.stringify(DEFAULT_PROGRAM.weeks));
            }
        }

        function saveWorkoutData() {
            updateTodayHistoryRecord();
            localStorage.setItem(`WORKOUT_${currentStudent}`, JSON.stringify(workoutData));
            updateMetrics();

            setSyncStatus("loading", "Salvando...");
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                sendDataToSheetsDirect(workoutData);
            }, 600);
        }

        function sendDataToSheetsDirect(dataToSync) {
            if (!API_URL) return;
            const currentMonth = getTodayMonthKey();
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    aluno: currentStudent,
                    mes: currentMonth,
                    token: API_SECRET_TOKEN,
                    data: dataToSync
                })
            }).then(() => {
                setSyncStatus("success", "Nuvem OK");
            }).catch(() => {
                setSyncStatus("error", "Erro ao Salvar");
            });
        }

        /* CRONÔMETRO REGRESSIVO DE DESCANSO (TIMER) */
        function parseRestTimeSeconds(str) {
            if (!str) return 60;
            const clean = String(str).toLowerCase().trim();
            if (clean.includes('min') || clean.includes('m')) {
                const match = clean.match(/(\d+(?:[.,]\d+)?)/);
                if (match) return Math.round(parseFloat(match[1].replace(',', '.')) * 60);
            }
            const matchSec = clean.match(/(\d+)/);
            if (matchSec) return parseInt(matchSec[1], 10);
            return 60;
        }

        function formatTimerSeconds(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function playBeepSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.log("Audio feedback error:", e);
            }
        }

        function startRestTimer(exIdx) {
            const currentWeek = workoutData.weeks[currentWeekIdx];
            if (!currentWeek || !currentWeek.days || !currentWeek.days[currentDayIdx]) return;
            const ex = currentWeek.days[currentDayIdx].exercises[exIdx];
            if (!ex) return;

            const seconds = parseRestTimeSeconds(ex.rest || "60s");

            if (restTimer.intervalId) {
                clearInterval(restTimer.intervalId);
            }

            restTimer.exIdx = exIdx;
            restTimer.remaining = seconds;
            restTimer.total = seconds;

            updateRestTimerBadgeUI();

            restTimer.intervalId = setInterval(() => {
                restTimer.remaining--;
                if (restTimer.remaining <= 0) {
                    clearInterval(restTimer.intervalId);
                    restTimer.intervalId = null;
                    updateRestTimerBadgeUI();
                    playBeepSound();
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200, 100, 300]);
                    }
                    showToast("Descanso finalizado! Próxima série!", "fa-bell", "text-emerald-400");
                } else {
                    updateRestTimerBadgeUI();
                }
            }, 1000);
        }

        function cancelRestTimer() {
            if (restTimer.intervalId) {
                clearInterval(restTimer.intervalId);
                restTimer.intervalId = null;
            }
            restTimer.exIdx = null;
            restTimer.remaining = 0;
            updateRestTimerBadgeUI();
            showToast("Cronômetro cancelado", "fa-stop", "text-slate-400");
        }

        function updateRestTimerBadgeUI() {
            const allBadges = document.querySelectorAll('[id^="rest-timer-container-"]');
            allBadges.forEach(el => { el.innerHTML = ''; });

            if (restTimer.exIdx !== null && restTimer.remaining > 0) {
                const targetContainer = document.getElementById(`rest-timer-container-${restTimer.exIdx}`);
                if (targetContainer) {
                    targetContainer.innerHTML = `
                        <button onclick="cancelRestTimer()" title="Clique para cancelar o descanso" class="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-[10px] font-extrabold flex items-center gap-1.5 shadow-sm active:scale-95 transition animate-pulse">
                            <i class="fa-solid fa-stopwatch text-[9px] text-emerald-300"></i>
                            <span>Descanso: ${formatTimerSeconds(restTimer.remaining)}</span>
                            <i class="fa-solid fa-xmark text-[8px] text-slate-400 hover:text-white ml-0.5"></i>
                        </button>
                    `;
                }
            }
        }

        function isDayCompleted(weekIdx, dayIdx) {
            const week = workoutData.weeks ? workoutData.weeks[weekIdx] : null;
            if (!week || !week.days || !week.days[dayIdx]) return false;
            const day = week.days[dayIdx];
            if (day.missed) return true;
            const exercises = day.exercises || [];
            if (exercises.length === 0) return false;
            return exercises.every(ex => {
                const count = ex.sets || 4;
                const logs = ex.logs || [];
                for (let s = 0; s < count; s++) {
                    if (!logs[s] || !logs[s].done) return false;
                }
                return true;
            });
        }

            const currentWeek = workoutData.weeks[currentWeekIdx];
            const currentDay = currentWeek.days[currentDayIdx];
            const exercises = currentDay.exercises || [];

                const exCard = document.createElement('div');
                exCard.className = 'bg-slate-900 border border-slate-800/90 rounded-2xl p-3.5 shadow-sm space-y-3';

                const setsCount = ex.sets || 4;
                if (!ex.logs) ex.logs = [];

                let setsRowsHtml = '';
                for (let s = 0; s < setsCount; s++) {
                    const log = ex.logs[s] || { load: '', reps: '', done: false };
                    const isDone = Boolean(log.done);

                    setsRowsHtml += `
                        <div class="flex items-center justify-between gap-1.5 p-1.5 rounded-xl transition ${isDone ? 'bg-emerald-950/25 border border-emerald-800/40' : 'bg-slate-950 border border-slate-800/80'}">
                            <div class="w-6 shrink-0 text-center font-extrabold text-[11px] ${isDone ? 'text-emerald-400' : 'text-slate-500'}">

                            </div>
                            <div class="flex-1 min-w-0 flex items-center justify-between bg-slate-900/90 p-1 rounded-lg border border-slate-800/80">
                                <button onclick="adjustSetVal(${exIdx}, ${s}, 'load', -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md font-bold text-xs flex items-center justify-center shrink-0">-</button>
                                <div class="flex items-center justify-center gap-0.5 min-w-0 px-0.5">
                                    <input type="number" step="0.5" inputmode="decimal" placeholder="0" value="${log.load !== undefined ? log.load : ''}" 
                                        onchange="updateSetLog(${exIdx}, ${s}, 'load', this.value)"
                                        class="w-8 sm:w-10 bg-transparent text-center font-extrabold text-xs text-white focus:outline-none p-0">
                                    <span class="text-[9px] text-slate-500 font-bold shrink-0">kg</span>
                                </div>
                                <button onclick="adjustSetVal(${exIdx}, ${s}, 'load', 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md font-bold text-xs flex items-center justify-center shrink-0">+</button>
                            </div>
                            <div class="flex-1 min-w-0 flex items-center justify-between bg-slate-900/90 p-1 rounded-lg border border-slate-800/80">
                                <button onclick="adjustSetVal(${exIdx}, ${s}, 'reps', -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md font-bold text-xs flex items-center justify-center shrink-0">-</button>
                                <div class="flex items-center justify-center gap-0.5 min-w-0 px-0.5">
                                    <input type="number" inputmode="numeric" placeholder="${ex.targetReps}" value="${log.reps !== undefined ? log.reps : ''}" 
                                        onchange="updateSetLog(${exIdx}, ${s}, 'reps', this.value)"
                                        class="w-7 sm:w-9 bg-transparent text-center font-extrabold text-xs text-white focus:outline-none p-0">
                                    <span class="text-[9px] text-slate-500 font-bold shrink-0">rep</span>
                                </div>
                                <button onclick="adjustSetVal(${exIdx}, ${s}, 'reps', 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md font-bold text-xs flex items-center justify-center shrink-0">+</button>
                            </div>
                            <button onclick="toggleSetDone(${exIdx}, ${s})" class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center transition ${isDone ? 'bg-emerald-500 text-slate-950 font-black shadow-md' : 'bg-slate-800 border border-slate-700/80 text-slate-500'}">
                                <i class="fa-solid ${isDone ? 'fa-check text-sm' : 'fa-check text-xs opacity-40'}"></i>
                            </button>
                        </div>
                    `;
                }

                exCard.innerHTML = `
                    <div class="flex items-start justify-between gap-2">

                            <div class="flex flex-wrap items-center gap-2 mt-1">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20">${setsCount} séries × ${ex.targetReps} reps</span>
                                <button onclick="startRestTimer(${exIdx})" class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 active:scale-95 transition flex items-center gap-1 cursor-pointer">
                                    <i class="fa-solid fa-stopwatch text-[9px]"></i> ${ex.rest}
                                </button>
                                <div id="rest-timer-container-${exIdx}"></div>
                            </div>

                    </div>
                    ${ex.notes ? `<p class="text-[11px] text-slate-400 bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5 flex items-start gap-2"><i class="fa-solid fa-circle-info text-blue-400 text-xs mt-0.5"></i><span>${escapeHtml(ex.notes)}</span></p>` : ''}
                    <div class="space-y-1.5 pt-1">${setsRowsHtml}</div>

        function adjustSetVal(exIdx, setIdx, field, delta) {
            const ex = workoutData.weeks[currentWeekIdx].days[currentDayIdx].exercises[exIdx];
            if (!ex.logs) ex.logs = [];
            if (!ex.logs[setIdx]) ex.logs[setIdx] = { load: '', reps: 10, done: false };

            let currentVal = parseFloat(ex.logs[setIdx][field]) || 0;
            ex.logs[setIdx][field] = Math.max(0, currentVal + delta);
            saveWorkoutData();
            renderExercises();
        }

        function updateSetLog(exIdx, setIdx, field, value) {
            const ex = workoutData.weeks[currentWeekIdx].days[currentDayIdx].exercises[exIdx];
            if (!ex.logs) ex.logs = [];
            if (!ex.logs[setIdx]) ex.logs[setIdx] = { load: '', reps: '', done: false };

            ex.logs[setIdx][field] = value === '' ? '' : parseFloat(value);
            saveWorkoutData();
        }

        function toggleSetDone(exIdx, setIdx) {
            const ex = workoutData.weeks[currentWeekIdx].days[currentDayIdx].exercises[exIdx];
            if (!ex.logs) ex.logs = [];
            if (!ex.logs[setIdx]) ex.logs[setIdx] = { load: '', reps: 10, done: false };

            const wasDone = ex.logs[setIdx].done;
            ex.logs[setIdx].done = !wasDone;

            if (!wasDone) {
                startRestTimer(exIdx);
            }

            saveWorkoutData();
            renderExercises();
            renderDayTabs();
        }

        function updateMetrics() {
            const week = workoutData.weeks[currentWeekIdx];
            const day = week.days[currentDayIdx];
            let totalSets = 0, completedSets = 0, tonnage = 0;

            (day.exercises || []).forEach(ex => {
                const count = ex.sets || 4;
                totalSets += count;
                (ex.logs || []).forEach(log => {
                    if (log && log.done) {
                        completedSets++;
                        const l = parseFloat(log.load) || 0;
                        const r = parseFloat(log.reps) || 10;
                        tonnage += (l * r);
                    }
                });
            });

            const pct = totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 0;
            const elPct = document.getElementById('metric-progress-percent');
            const elCount = document.getElementById('metric-progress-count');
            const elBar = document.getElementById('metric-progress-bar');
            const elTonnage = document.getElementById('metric-tonnage');

            if (elPct) elPct.textContent = `${pct}%`;
            if (elCount) elCount.textContent = `${completedSets}/${totalSets} séries`;
            if (elBar) elBar.style.width = `${pct}%`;
            if (elTonnage) elTonnage.innerHTML = `${tonnage.toLocaleString('pt-BR')} <span class="text-[10px] font-normal text-slate-400">kg</span>`;
        }

        function updateTodayHistoryRecord() {
            const d = new Date();
            const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const currentWeek = workoutData.weeks[currentWeekIdx];
            const currentDay = currentWeek.days[currentDayIdx];

            if (!workoutData.history) workoutData.history = {};
            workoutData.history[dateKey] = {
                dateKey: dateKey,
                dateFormatted: d.toLocaleDateString('pt-BR'),
                weekTitle: currentWeek.title,
                dayName: currentDay.name,
                exercises: JSON.parse(JSON.stringify(currentDay.exercises || [])),
                notes: currentDay.notes || ''
            };
        }

        function saveSessionNotes() {
            workoutData.weeks[currentWeekIdx].days[currentDayIdx].notes = document.getElementById('session-notes').value;
            saveWorkoutData();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function showToast(msg, iconClass = "fa-circle-check", iconColor = "text-emerald-400") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('toast-icon').className = `fa-solid ${iconClass} ${iconColor}`;
            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
